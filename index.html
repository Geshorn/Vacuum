<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vacuum Rush</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="game"></div>

<div id="bar">
  <b>Vacuum Rush</b>
  <span>Круг <b id="lap">0</b></span>
  <span>Время <b id="time">0:00.0</b></span>
  <span>Лучший <b id="best">—</b></span>
  <span class="sp"></span>
  <span id="batt"><i id="battbar"><i id="battfill"></i></i><b id="battpct">100%</b></span>
  <span id="clock">--:--</span>
</div>

<div id="say"></div>
<div id="hint">Стрелки — руль и газ · Пробел — дрифт · без нажатий едет автопилот</div>
<canvas id="minimap" width="220" height="160"></canvas>
<div id="speed"><b id="spd">0</b><small>км/ч</small></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
