<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Робот-пылесос для рабочего стола</title>
<style>
/* ===== Сцена ===== */
:root{--ink:#fff;--bar:rgba(30,10,30,.4);--shadow:0 1px 3px rgba(0,0,0,.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:rgba(10,4,16,.55)}}
:root[data-theme="dark"]{--bar:rgba(10,4,16,.55)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#14030c;font-family:-apple-system,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#desk{position:fixed;inset:0;overflow:hidden;background:
 radial-gradient(1.5px 1.5px at 12% 14%,#fff,transparent),radial-gradient(1.5px 1.5px at 28% 30%,#fff,transparent),radial-gradient(1px 1px at 44% 10%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 26%,#fff,transparent),radial-gradient(1px 1px at 83% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 34%,#fff,transparent),radial-gradient(1px 1px at 6% 40%,#fff,transparent),
 linear-gradient(180deg,#14030c 0%,#520b25 38%,#a81a2c 70%,#ff5b3a 100%)}
#desk.shake{animation:shake .3s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
#moon{position:absolute;left:72%;top:16%;width:min(14vmin,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd9c2,#ff6a4d 75%);box-shadow:0 0 70px 26px rgba(255,80,60,.45)}
#aurora{position:absolute;left:-10%;right:-10%;top:8%;height:42%;background:radial-gradient(ellipse at 30% 50%,rgba(255,70,90,.5),transparent 60%),radial-gradient(ellipse at 65% 40%,rgba(255,140,60,.4),transparent 60%);filter:blur(28px);animation:aurora 12s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translateX(6%) scaleY(1.15)}}
#scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%}

/* ===== Меню-бар, док, площадка, подсказка ===== */
#bar{position:absolute;left:0;right:0;top:0;height:calc(28px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;display:flex;align-items:center;gap:16px;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:13px;text-shadow:var(--shadow);z-index:50}
#bar b{font-weight:600}#bar .sp{flex:1}
#bar button{font:inherit;color:inherit;background:rgba(255,255,255,.18);border:0;border-radius:6px;padding:3px 10px;cursor:pointer}
#bar button:hover{background:rgba(255,255,255,.3)}
#bar button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#dock{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:10px;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.3);z-index:40}
#dock i{width:40px;height:40px;border-radius:10px;display:block}
#pad{position:absolute;width:74px;height:74px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);left:24px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:5}
#pad::after{content:"док";position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:10px;text-shadow:var(--shadow);opacity:.85}
#hint{position:absolute;left:50%;top:calc(46px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:12px;padding:5px 12px;border-radius:14px;background:var(--bar);text-shadow:var(--shadow);z-index:45;transition:opacity .6s;text-align:center;max-width:90vw}

/* ===== Файлы ===== */
.ic{position:absolute;width:84px;text-align:center;transition:left .45s cubic-bezier(.5,0,.8,.4),top .45s cubic-bezier(.5,0,.8,.4),transform .45s,opacity .45s;z-index:10}
.ic.in{animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-60px) scale(1.4);opacity:0}}
.ic.spill{transition:left .6s cubic-bezier(.2,.9,.3,1.25),top .6s cubic-bezier(.2,.9,.3,1.25),transform .45s,opacity .45s;animation:pop .6s}
@keyframes pop{from{transform:scale(.3) rotate(-200deg)}}
.ic.out{transform:scale(.1) rotate(200deg);opacity:0}
.ic.hit{animation:wob .35s}
@keyframes wob{25%{transform:rotate(-14deg) scale(1.1)}60%{transform:rotate(10deg)}}
.ic.boom{transform:scale(1.7);opacity:0;transition:transform .3s,opacity .3s}
.g{width:46px;height:46px;margin:0 auto 4px;position:relative;border-radius:8px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.n{font-size:11px;line-height:1.2;text-shadow:var(--shadow);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.folder{height:36px;margin-top:6px;background:linear-gradient(#5db2ff,#2f86e8);border-radius:6px}
.folder::before{content:"";position:absolute;left:0;top:-6px;width:20px;height:8px;background:#5db2ff;border-radius:5px 5px 0 0}
.ic.cracked .folder{filter:brightness(.82) drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.ic.cracked .folder::after{content:"";position:absolute;left:14px;top:-2px;width:3px;height:38px;background:#0a2b5a;transform:rotate(18deg);box-shadow:12px 3px 0 #0a2b5a}
.doc{width:38px;background:#fafafa repeating-linear-gradient(#fafafa 0 5px,#c9ced6 5px 6px) 6px 12px/26px 28px no-repeat}
.img{background:linear-gradient(135deg,#6fd0ff,#b57bff 55%,#ff8fb0);border:2px solid #fff}
.shot{background:linear-gradient(160deg,#1e2a44,#3b5bdb 60%,#9fb4ff);border:2px solid #fff;height:34px;margin-top:6px}
.term{background:#1d1d22;border:1px solid #555}
.term::after{content:"> _";position:absolute;left:6px;top:8px;font:11px monospace;color:#6ef08a}
.vid{background:#15151a;border:1px solid #555}
.vid::after{content:"";position:absolute;left:17px;top:14px;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.deb{position:absolute;width:9px;height:9px;margin:-4px;border-radius:2px;background:#5db2ff;z-index:12;animation:deb .6s ease-out forwards}
@keyframes deb{to{transform:translate(var(--dx),var(--dy)) rotate(280deg);opacity:0}}

/* ===== Трасса и опасности ===== */
#track{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.oil{position:absolute;z-index:3;border-radius:50% 46% 52% 48%;background:radial-gradient(ellipse at 35% 30%,#4b4670,#0b0a16 70%);box-shadow:inset 0 0 14px rgba(170,110,255,.55),0 0 10px rgba(0,0,0,.4)}
.oil::after{content:"";position:absolute;inset:18%;border-radius:50%;background:conic-gradient(from 40deg,rgba(255,80,180,.28),rgba(80,200,255,.28),rgba(255,220,80,.28),rgba(255,80,180,.28))}
.mine{position:absolute;z-index:9;width:30px;height:30px;margin:-15px;border-radius:50%;background:radial-gradient(circle,#4a4a52 0 35%,#1a1a20 38%);box-shadow:0 0 0 3px #3a3a42,0 3px 6px rgba(0,0,0,.5)}
.mine::after{content:"";position:absolute;left:11px;top:11px;width:8px;height:8px;border-radius:50%;background:#ff2d2d;animation:led 1s infinite}
@keyframes led{50%{opacity:.2}}
.mine.pop{animation:pop2 .3s forwards}
@keyframes pop2{to{transform:scale(2.5);opacity:0}}
.blast{position:absolute;z-index:12;width:20px;height:20px;margin:-10px;border-radius:50%;border:4px solid #ffb347;animation:blast .5s ease-out forwards}
@keyframes blast{to{transform:scale(8);opacity:0}}
.wall{position:absolute;z-index:9;height:18px;transform-origin:0 50%;transform:translate(0,-50%) scaleX(0);border-radius:3px;background:repeating-linear-gradient(45deg,#ffcc00 0 10px,#1b1b1f 10px 20px);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.wall.warn{animation:warn .3s infinite}
@keyframes warn{50%{opacity:.35}}
/* ===== Батарея ===== */
#batt{display:flex;align-items:center;gap:6px}
#battbar{position:relative;width:26px;height:12px;border:1.5px solid #fff;border-radius:3px;padding:1px}
#battbar::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:5px;background:#fff;border-radius:0 1px 1px 0}
#battfill{display:block;height:100%;width:100%;background:#4cd964;border-radius:1px;transition:width .2s}
#batt.mid #battfill{background:#ffb020}#batt.low #battfill{background:#ff3b30}
#batt.low{animation:blink 1s infinite}@keyframes blink{50%{opacity:.45}}
#batt.chg #battfill{animation:chg 1s infinite}@keyframes chg{50%{opacity:.5}}
/* ===== Дрифт ===== */
.skid{position:absolute;width:7px;height:7px;margin:-3px;border-radius:50%;background:rgba(10,0,8,.6);animation:skid 2.8s forwards}
@keyframes skid{to{opacity:0}}
.smoke{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;background:rgba(235,235,245,.5);animation:smoke .8s ease-out forwards}
@keyframes smoke{to{opacity:0;transform:translateY(-16px) scale(2.2)}}
#bot.dead{filter:grayscale(1) brightness(.55)}
/* ===== Робот ===== */
#trail{position:absolute;inset:0;pointer-events:none;z-index:8}
.tr{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:rgba(255,255,255,.7);animation:fade 1.1s forwards}
@keyframes fade{to{opacity:0;transform:scale(2.4)}}
#bot{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;z-index:30;pointer-events:none;will-change:transform}
#bot .b{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e4e7ee 60%,#b9bfcc);box-shadow:0 6px 10px rgba(0,0,0,.4),inset 0 0 0 3px #d4d8e2}
#bot .b::before{content:"";position:absolute;left:19px;top:19px;width:20px;height:20px;border-radius:50%;background:radial-gradient(#4a5060,#262a33);box-shadow:0 0 0 3px #eef0f5,0 0 0 5px #3ea0ff}
#bot .b::after{content:"";position:absolute;right:-3px;top:23px;width:12px;height:12px;border-radius:50%;background:#2a2e38;border:2px solid #f2f4f8}
#bot.angry .b::before{box-shadow:0 0 0 3px #eef0f5,0 0 0 5px #ff4040}
#say{position:absolute;bottom:62px;left:50%;transform:translateX(-50%) scale(.6);transform-origin:bottom center;white-space:nowrap;background:#fff;color:#2a2438;font-size:12px;font-weight:500;padding:5px 11px;border-radius:12px;opacity:0;transition:opacity .2s,transform .2s;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#say.on{opacity:1;transform:translateX(-50%) scale(1)}
</style>
</head>

/* =====================================================================
   3. ПОМОЩНИКИ
   ===================================================================== */
function pick(list) {  // случайная фраза, не повторяя прошлую
  var s = list[Math.floor(Math.random() * list.length)];
  if (list.length > 1 && s === list._last) return pick(list);
  list._last = s; return s;
}
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function pad2(n) { return ('0' + n).slice(-2); }
function wrap(d) { while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
function fill(s, v) { return s.replace(/\{(\w+)\}/g, function (m, k) { return v && v[k] != null ? v[k] : m; }); }
function approach(v, target, rate, dt) { return v < target ? Math.min(target, v + rate * dt) : Math.max(target, v - rate * dt); }
function $(id) { return document.getElementById(id); }

var D = { desk: $('desk'), bot: $('bot'), body: $('body'), say: $('say'), trail: $('trail'), cnt: $('cnt'), hint: $('hint'), mess: $('mess'), clock: $('clock'), track: $('track'), batt: $('batt'), battfill: $('battfill'), battpct: $('battpct') };

/* =====================================================================
   4. РАБОЧИЙ СТОЛ: иконки, папки, разлёт содержимого
   ===================================================================== */
var desk = { items: [], track: 0, oil: [], mines: [], walls: [], collected: 0, total: 0, W: 0, H: 0 };

desk.measure = function () { desk.W = D.desk.clientWidth; desk.H = D.desk.clientHeight; };
desk.homePos = function () { return { x: C.home.x, y: desk.H - C.home.fromBottom }; };
desk.counter = function () { D.cnt.textContent = 'Собрано: ' + desk.collected + ' / ' + desk.total; };

desk.addIcon = function (name, type, x, y, animate) {
  var el = document.createElement('div');
  el.className = 'ic' + (animate ? ' in' : '');
  el.innerHTML = '<div class="g ' + type + '"></div><div class="n"></div>';
  el.lastChild.textContent = name;
  el.style.left = (x - 42) + 'px'; el.style.top = (y - 30) + 'px';
  D.desk.appendChild(el);
  var it = { el: el, name: name, type: type, x: x, y: y, done: false, readyAt: 0,
             hp: type === 'folder' ? C.folderHits : 0, loot: type === 'folder' ? 3 + Math.floor(Math.random() * 3) : 0 };
  desk.items.push(it); desk.total++; desk.counter();
  return it;
};

/* ---- трасса: замкнутая дорога со скруглёнными углами ---- */
desk.pts = []; desk.trackLen = 1; desk.trackW = 100;

desk.buildTrack = function () {
  var W = desk.W, H = desk.H, m = Math.min(W, H), PI = Math.PI;
  var tw = clamp(m * 0.15, 76, 120), x0 = W * 0.1, x1 = W * 0.9, y0 = Math.max(H * 0.24, 110 + tw / 2), y1 = H * 0.68;
  var R = Math.min(m * 0.14, (x1 - x0) / 2 - 4, (y1 - y0) / 2 - 4), step = 8, pts = [];
  function seg(ax, ay, bx, by) { var n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / step)); for (var i = 0; i < n; i++) pts.push({ x: ax + (bx - ax) * i / n, y: ay + (by - ay) * i / n }); }
  function arc(cx, cy, a0, a1) { var n = Math.max(2, Math.round(R * Math.abs(a1 - a0) / step)); for (var i = 0; i < n; i++) { var a = a0 + (a1 - a0) * i / n; pts.push({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R }); } }
  seg(x0 + R, y0, x1 - R, y0); arc(x1 - R, y0 + R, -PI / 2, 0);
  seg(x1, y0 + R, x1, y1 - R); arc(x1 - R, y1 - R, 0, PI / 2);
  seg(x1 - R, y1, x0 + R, y1); arc(x0 + R, y1 - R, PI / 2, PI);
  seg(x0, y1 - R, x0, y0 + R); arc(x0 + R, y0 + R, PI, 1.5 * PI);
  pts.forEach(function (p, i) {                     // направление и нормаль внутрь трассы
    var q = pts[(i + 1) % pts.length], a = Math.atan2(q.y - p.y, q.x - p.x);
    p.a = a; p.nx = -Math.sin(a); p.ny = Math.cos(a);
  });
  desk.pts = pts; desk.trackLen = pts.length * step; desk.trackW = tw;
  var d = 'M' + (x0 + R) + ' ' + y0 + ' H' + (x1 - R) + ' A' + R + ' ' + R + ' 0 0 1 ' + x1 + ' ' + (y0 + R) + ' V' + (y1 - R) +
          ' A' + R + ' ' + R + ' 0 0 1 ' + (x1 - R) + ' ' + y1 + ' H' + (x0 + R) + ' A' + R + ' ' + R + ' 0 0 1 ' + x0 + ' ' + (y1 - R) +
          ' V' + (y0 + R) + ' A' + R + ' ' + R + ' 0 0 1 ' + (x0 + R) + ' ' + y0 + ' Z';
  var cx = (x0 + x1) / 2;
  D.track.innerHTML =
    '<path d="' + d + '" fill="none" stroke="#f1eaee" stroke-width="' + (tw + 16) + '"/>' +
    '<path d="' + d + '" fill="none" stroke="#d1243c" stroke-width="' + (tw + 16) + '" stroke-dasharray="24 24"/>' +
    '<path d="' + d + '" fill="none" stroke="#2a2231" stroke-opacity=".92" stroke-width="' + tw + '"/>' +
    '<path d="' + d + '" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-dasharray="18 16"/>' +
    '<line x1="' + cx + '" y1="' + (y0 - tw / 2) + '" x2="' + cx + '" y2="' + (y0 + tw / 2) + '" stroke="#fff" stroke-width="12"/>' +
    '<line x1="' + cx + '" y1="' + (y0 - tw / 2) + '" x2="' + cx + '" y2="' + (y0 + tw / 2) + '" stroke="#111" stroke-width="12" stroke-dasharray="12 12"/>';
};

// точка на трассе: s — расстояние вдоль, u — смещение от центра внутрь (минус — наружу)
desk.trackPoint = function (s, u) {
  var n = desk.pts.length, p = desk.pts[Math.floor((((s % desk.trackLen) + desk.trackLen) % desk.trackLen) / desk.trackLen * n) % n];
  return { x: p.x + p.nx * u, y: p.y + p.ny * u, a: p.a, nx: p.nx, ny: p.ny };
};

/* ---- опасности: масло, мины, выдвижные стены ---- */
desk.hazards = function () { return desk.oil.concat(desk.mines, desk.walls); };

// можно ли класть здесь файл (мины и стены отпугивают автопилот — файлы подальше)
desk.blocked = function (x, y, pad) {
  if (desk.oil.some(function (o) { return Math.hypot(o.x - x, o.y - y) < o.r + pad * 0.5; })) return true;
  if (desk.mines.some(function (m) { return Math.hypot(m.x - x, m.y - y) < C.mineR + pad + 60; })) return true;
  return desk.walls.some(function (w) {
    for (var f = 0; f <= 1; f += 0.5)
      if (Math.hypot(w.x + Math.cos(w.ang) * w.max * f - x, w.y + Math.sin(w.ang) * w.max * f - y) < pad + 40) return true;
    return false;
  });
};

desk.spot = function (minDist) {   // случайная точка на трассе вдали от других опасностей, робота и дока
  var home = desk.homePos(), best = null, all = desk.hazards();
  for (var i = 0; i < 80; i++) {
    var p = desk.trackPoint(Math.random() * desk.trackLen, rand(-0.7, 0.7) * desk.trackW / 2);
    best = p;
    var ok = Math.hypot(p.x - home.x, p.y - home.y) > 140 && all.every(function (h) { return Math.hypot(h.x - p.x, h.y - p.y) > minDist; });
    if (typeof r !== 'undefined' && Math.hypot(p.x - r.x, p.y - r.y) < 170) ok = false;
    if (ok) return p;
  }
  return best;
};

desk.addOil = function () {
  var p = desk.spot(120), rr = Math.round(rand(34, 46)), el = document.createElement('div');
  el.className = 'oil';
  el.style.cssText = 'left:' + (p.x - rr) + 'px;top:' + (p.y - rr) + 'px;width:' + rr * 2 + 'px;height:' + rr * 2 + 'px';
  D.desk.appendChild(el);
  desk.oil.push({ el: el, x: p.x, y: p.y, r: rr * 0.9 });
};

desk.addMine = function () {
  var p = desk.spot(90), el = document.createElement('div');
  el.className = 'mine'; el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
  D.desk.appendChild(el);
  desk.mines.push({ el: el, x: p.x, y: p.y, dead: false });
};

desk.addWall = function (i, n) {   // стена выдвигается от края трассы поперёк дороги, оставляя проезд
  var side = i % 2 ? 1 : -1, tp = desk.trackPoint(((i + 0.5) / n + rand(-0.04, 0.04)) * desk.trackLen, side * desk.trackW / 2);
  var dx = -tp.nx * side, dy = -tp.ny * side, max = Math.round(desk.trackW * 0.72), el = document.createElement('div');
  el.className = 'wall';
  el.style.cssText = 'left:' + tp.x + 'px;top:' + tp.y + 'px;width:' + max + 'px';
  D.desk.appendChild(el);
  desk.walls.push({ el: el, x: tp.x, y: tp.y, ang: Math.atan2(dy, dx), max: max, ext: 0, active: false, offset: rand(0, C.wallPeriod), lastE: -1, lastWarn: false });
};

desk.makeHazards = function () {
  desk.hazards().forEach(function (h) { h.el.remove(); });
  desk.oil = []; desk.mines = []; desk.walls = [];
  var mob = window.innerWidth < C.mobileWidth, i;
  var nw = mob ? 3 : C.wallCount, no = mob ? 3 : C.oilCount, nm = mob ? 4 : C.mineCount;
  for (i = 0; i < nw; i++) desk.addWall(i, nw);
  for (i = 0; i < no; i++) desk.addOil();
  for (i = 0; i < nm; i++) desk.addMine();
};

// цикл стены: убрана → мигает (предупреждение) → выдвигается → стоит → убирается
desk.updateWalls = function (t) {
  desk.walls.forEach(function (w) {
    var f = ((t + w.offset) % C.wallPeriod) / C.wallPeriod, e, warn = false;
    if (f < 0.43) e = 0;
    else if (f < 0.57) { e = 0; warn = true; }
    else if (f < 0.625) e = (f - 0.57) / 0.055;
    else if (f < 0.946) e = 1;
    else e = 1 - (f - 0.946) / 0.054;
    e = clamp(e, 0, 1);
    w.ext = e * w.max; w.active = warn || e > 0;
    if (e !== w.lastE || warn !== w.lastWarn) {
      w.lastE = e; w.lastWarn = warn;
      w.el.style.transform = 'translate(0,-50%) rotate(' + w.ang + 'rad) scaleX(' + Math.max(e, warn ? 0.12 : 0) + ')';
      w.el.classList.toggle('warn', warn);
    }
  });
};

desk.blast = function (x, y) {
  var b = document.createElement('div'); b.className = 'blast'; b.style.left = x + 'px'; b.style.top = y + 'px';
  D.desk.appendChild(b); setTimeout(function () { b.remove(); }, 520);
  desk.debris(x, y, '#ffb347');
};

desk.respawnMine = function (m) {
  desk.mines = desk.mines.filter(function (x) { return x !== m; });
  desk.addMine();
};

desk.scatter = function () {
  var list = window.innerWidth < C.mobileWidth ? C.files.slice(0, C.mobileFiles) : C.files, pts = [];
  list.forEach(function (f) {
    var x, y, ok, tries = 0;
    do {
      if (Math.random() < 0.65) { var tp = desk.trackPoint(Math.random() * desk.trackLen, rand(-0.8, 0.8) * desk.trackW / 2); x = tp.x; y = tp.y; }
      else { x = 60 + Math.random() * (desk.W - 120); y = 80 + Math.random() * (desk.H - 240); }
      ok = pts.every(function (p) { return Math.hypot(p.x - x, p.y - y) > 90; }) && !desk.blocked(x, y, 60); tries++;
    } while (!ok && tries < 80);
    pts.push({ x: x, y: y }); desk.addIcon(f[0], f[1], x, y, true);
  });
};

desk.reset = function () {
  desk.items.forEach(function (i) { i.el.remove(); });
  desk.items = []; desk.collected = 0; desk.total = 0;
  desk.makeHazards(); desk.scatter();
};

desk.nearest = function (x, y) {
  var best = null, bd = Infinity;
  desk.items.forEach(function (i) {
    if (i.done) return;
    var d = Math.hypot(i.x - x, i.y - y);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
};

desk.isClean = function () { return desk.collected >= desk.total; };

// Файл «засасывается» в робота
desk.suck = function (it, rx, ry) {
  it.done = true; desk.collected++; desk.counter();
  it.el.style.left = (rx - 42) + 'px'; it.el.style.top = (ry - 30) + 'px';
  it.el.classList.add('out');
  setTimeout(function () { it.el.remove(); }, 500);
};

// Из папки сыпятся файлы
desk.spill = function (folder, count) {
  for (var i = 0; i < count; i++) {
    (function () {
      var f = C.loot[Math.floor(Math.random() * C.loot.length)], tx, ty, k = 0;
      do {
        var ang = rand(0, Math.PI * 2), rad = rand(75, 150);
        tx = clamp(folder.x + Math.cos(ang) * rad, 50, desk.W - 50); ty = clamp(folder.y + Math.sin(ang) * rad, 80, desk.H - 130); k++;
      } while (k < 10 && desk.blocked(tx, ty, 34));
      var n = desk.addIcon(f[0], f[1], folder.x, folder.y, false);
      n.el.classList.add('spill');
      n.x = tx; n.y = ty; n.readyAt = performance.now() + 750;
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        n.el.style.left = (tx - 42) + 'px'; n.el.style.top = (ty - 30) + 'px';
      }); });
    })();
  }
};

desk.debris = function (x, y, color) {
  for (var i = 0; i < 9; i++) {
    var d = document.createElement('div'), a = rand(0, Math.PI * 2), r = rand(40, 90);
    d.className = 'deb'; if (color) d.style.background = color; d.style.left = x + 'px'; d.style.top = y + 'px';
    d.style.setProperty('--dx', Math.cos(a) * r + 'px'); d.style.setProperty('--dy', Math.sin(a) * r + 'px');
    D.desk.appendChild(d); setTimeout(function (e) { e.remove(); }.bind(null, d), 650);
  }
};

desk.shake = function () { D.desk.classList.remove('shake'); void D.desk.offsetWidth; D.desk.classList.add('shake'); };

/* =====================================================================
   5. РОБОТ
   Физика: скорость раскладывается на r.v (вдоль носа) и r.lat (боком).
   Сцепление гасит боковую скорость; в дрифте оно слабое — робот скользит.
   ===================================================================== */
var r = { x: 0, y: 0, a: -1.2, v: 0, lat: 0,
          wait: 0, home: false, ram: null, wasManual: false, sayTimer: 0, nextIdle: 0,
          lastWall: -1e9, lastWeak: -1e9, lastBump: -1e9, lastDriftSay: -1e9,
          bat: 100, needCharge: false, dead: false, deadUntil: 0, warn20: false, warn10: false,
          drifting: false, driftUntil: 0, driftCool: 0,
          stunUntil: 0, spinDir: 1, wasSlick: false, oilSpin: 0, lastOil: -1e9, lastWallHit: -1e9 };
var input = { keys: {}, lastKeyTime: 0, manual: false };
var T = 0;

function say(text, ms) {
  D.say.textContent = text; D.say.classList.add('on');
  clearTimeout(r.sayTimer); r.sayTimer = setTimeout(function () { D.say.classList.remove('on'); }, ms || 1800);
}
function sayFrom(list, vars, ms) { say(fill(pick(list), vars), ms); }
function scheduleIdle(t) { r.nextIdle = t + rand(C.idleMs[0], C.idleMs[1]); }
function showHint(t) { D.hint.textContent = t; D.hint.style.opacity = 1; }
function hideHint() { D.hint.style.opacity = 0; }
function drain(x) { r.bat = Math.max(0, r.bat - x); }

/* ---- след: обычный, а в дрифте — следы покрышек и дым ---- */
var lastTrail = 0;
function dot(cls, x, y, life) {
  var d = document.createElement('div'); d.className = cls; d.style.left = x + 'px'; d.style.top = y + 'px';
  D.trail.appendChild(d); setTimeout(function () { d.remove(); }, life);
}
function trail(t) {
  if (t - lastTrail < C.trailMs) return;
  var sp = Math.hypot(r.v, r.lat);
  if (Math.abs(r.lat) > 70) {
    lastTrail = t;
    var fx = Math.cos(r.a), fy = Math.sin(r.a), bx = r.x - fx * 14, by = r.y - fy * 14;
    dot('skid', bx - fy * 13, by + fx * 13, 2800); dot('skid', bx + fy * 13, by - fx * 13, 2800);
    if (Math.random() < 0.5) dot('smoke', bx, by, 800);
  } else if (sp > 20) { lastTrail = t; dot('tr', r.x, r.y, 1100); }
}

/* ---- сбор обычного файла ---- */
function collect(it) {
  desk.suck(it, r.x, r.y); r.wait = 0.28; drain(C.cost.collect);
  var n = desk.collected, vars = { n: n, name: it.name };
  if (P.milestone[n] && !desk.isClean()) { sayFrom(P.milestone[n], vars, 2300); return; }
  for (var i = 0; i < P.byName.length; i++)
    if (P.byName[i].re.test(it.name) && Math.random() < 0.6) { sayFrom(P.byName[i].lines, vars, 2300); return; }
  if (Math.random() < C.sayChance) sayFrom(P.collect[it.type], vars, 1900);
}

/* ---- папки: удар, трещина, разлом ---- */
function damageFolder(f) {
  f.hp--;
  desk.shake();
  f.el.classList.remove('hit'); void f.el.offsetWidth; f.el.classList.add('hit');
  if (f.hp > 0) {
    f.el.classList.add('cracked');
    var first = Math.max(1, Math.floor(f.loot / 2));
    f.loot -= first; desk.spill(f, first);
    sayFrom(P.crack, null, 1800);
  } else {
    f.done = true; desk.collected++;
    desk.debris(f.x, f.y);
    f.el.classList.add('boom'); setTimeout(function () { f.el.remove(); }, 350);
    desk.spill(f, f.loot); desk.counter();
    sayFrom(P.smash, null, 2200);
  }
}

function hitFolder(f, t) {
  var dx = f.x - r.x, dy = f.y - r.y, d = Math.hypot(dx, dy) || 1, nx = dx / d, ny = dy / d;
  var fx = Math.cos(r.a), fy = Math.sin(r.a);
  var sp = (fx * r.v - fy * r.lat) * nx + (fy * r.v + fx * r.lat) * ny;   // скорость сближения с папкой (дрифтом тоже можно!)
  r.x = f.x - nx * (C.folderR + 1); r.y = f.y - ny * (C.folderR + 1);
  if (sp >= C.ramMin) {
    damageFolder(f); drain(C.cost.folder); r.v = C.bounce; r.lat = 0; r.wait = 0.4;
    if (r.ram) { r.ram.phase = 'back'; r.ram.px = null; }
  } else {
    r.v = Math.min(-80, -Math.abs(r.v) * 0.3); r.lat = 0;
    f.el.classList.remove('hit'); void f.el.offsetWidth; f.el.classList.add('hit');
    if (t - r.lastWeak > 2500) { r.lastWeak = t; sayFrom(P.weak, null, 1800); }
    if (!input.manual && !r.ram && !r.needCharge && !r.dead) r.ram = { target: f, phase: 'back', px: null, t0: t };
  }
}

/* ---- опасности: стены отбрасывают, мины взрываются ---- */
function bounce(nx, ny, restit) {   // отражает скорость от поверхности с нормалью (nx,ny); возвращает силу удара
  var fx = Math.cos(r.a), fy = Math.sin(r.a), wx = fx * r.v - fy * r.lat, wy = fy * r.v + fx * r.lat, vn = wx * nx + wy * ny;
  if (vn >= 0) return 0;
  wx -= (1 + restit) * vn * nx; wy -= (1 + restit) * vn * ny;
  r.v = wx * fx + wy * fy; r.lat = -wx * fy + wy * fx;
  return -vn;
}

function explodeMine(m, t) {
  m.dead = true; m.el.classList.add('pop'); setTimeout(function () { m.el.remove(); }, 320);
  desk.blast(m.x, m.y); desk.shake();
  var dx = r.x - m.x, dy = r.y - m.y, d = Math.hypot(dx, dy) || 1, fx = Math.cos(r.a), fy = Math.sin(r.a);
  var wx = dx / d * C.mineKick, wy = dy / d * C.mineKick;
  r.v = wx * fx + wy * fy; r.lat = -wx * fy + wy * fx;
  r.stunUntil = t + C.mineStunMs; r.spinDir = Math.random() < 0.5 ? -1 : 1;
  r.ram = null; r.drifting = false; r.wait = 0; drain(C.cost.mine);
  sayFrom(P.mine, null, 2200);
  setTimeout(function () { desk.respawnMine(m); }, C.mineRespawnMs);
}

function hitHazards(t) {
  desk.walls.forEach(function (w) {
    if (w.ext < 3) return;
    var ex = Math.cos(w.ang), ey = Math.sin(w.ang), dx = r.x - w.x, dy = r.y - w.y;
    var u = dx * ex + dy * ey, v = -dx * ey + dy * ex;
    var ddx = u - clamp(u, 0, w.ext), ddy = v - clamp(v, -9, 9), d = Math.hypot(ddx, ddy);
    if (d >= C.botR) return;
    var lx = ddx, ly = ddy;
    if (d < 0.001) { lx = 0; ly = v >= 0 ? 1 : -1; d = 0; } else { lx /= d; ly /= d; }
    var nx = lx * ex - ly * ey, ny = lx * ey + ly * ex;
    r.x += nx * (C.botR - d + 0.5); r.y += ny * (C.botR - d + 0.5);
    if (bounce(nx, ny, C.restitution) > 150) {
      drain(C.cost.wall);
      if (t - r.lastWallHit > 1800) { r.lastWallHit = t; sayFrom(P.trackWall, null, 1900); }
    }
  });
  desk.mines.forEach(function (m) {
    if (!m.dead && Math.hypot(m.x - r.x, m.y - r.y) < C.mineR + C.botR * 0.7) explodeMine(m, t);
  });
}

/* ---- автопилот ---- */
function wallClosest(w, x, y) {   // ближайшая к (x,y) точка стены в полностью выдвинутом виде
  var ex = Math.cos(w.ang), ey = Math.sin(w.ang), dx = x - w.x, dy = y - w.y;
  var u = clamp(dx * ex + dy * ey, 0, w.max), v = clamp(-dx * ey + dy * ex, -9, 9);
  return { x: w.x + ex * u - ey * v, y: w.y + ey * u + ex * v };
}

function steer(tx, ty, dist, dt) {
  var vx = tx - r.x, vy = ty - r.y, l = Math.hypot(vx, vy) || 1; vx /= l; vy /= l;
  function repel(cx, cy, edge, range, kmax) {      // отталкивание от опасности + обход сбоку
    var dx = r.x - cx, dy = r.y - cy, d = Math.hypot(dx, dy) || 1;
    if (d >= edge + range) return;
    var k = clamp(1 - (d - edge) / range, 0, 1) * kmax, px = -dy / d, py = dx / d;
    if (px * vx + py * vy < 0) { px = -px; py = -py; }
    vx += dx / d * k + px * k * 1.4; vy += dy / d * k + py * k * 1.4;
  }
  desk.mines.forEach(function (m) { if (!m.dead) repel(m.x, m.y, C.mineR + C.botR, 80, 2.6); });
  desk.oil.forEach(function (o) { repel(o.x, o.y, o.r, 45, 1); });
  desk.walls.forEach(function (w) { if (w.active) { var c = wallClosest(w, r.x, r.y); repel(c.x, c.y, C.botR + 9, 70, 2.4); } });
  var diff = wrap(Math.atan2(vy, vx) - r.a), tr = C.turn * (r.drifting ? 1.6 : 1);
  r.a += clamp(diff, -tr * dt, tr * dt);
  var want = Math.min(C.maxCruise, C.minCruise + dist * 2) * (Math.abs(diff) > 1.2 ? 0.35 : 1);
  r.v = approach(r.v, want, C.accel, dt);
  // на резких поворотах автопилот иногда эффектно уходит в дрифт
  if (!r.drifting && Math.hypot(r.v, r.lat) > 100 && Math.abs(diff) > 0.9 && T > r.driftCool && Math.random() < 0.5) {
    r.driftUntil = T + 800; r.driftCool = T + 6000;
  }
}

function segDist(px, py, ax, ay, bx, by) {
  var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, u = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  return Math.hypot(px - (ax + u * dx), py - (ay + u * dy));
}
function clearLine(ax, ay, bx, by) {   // на пути разгона нет мин, масла и стен
  return desk.mines.every(function (m) { return segDist(m.x, m.y, ax, ay, bx, by) > C.mineR + C.botR + 12; }) &&
         desk.oil.every(function (o) { return segDist(o.x, o.y, ax, ay, bx, by) > o.r + 6; }) &&
         desk.walls.every(function (w) {
           for (var f = 0; f <= 1; f += 0.25)
             if (segDist(w.x + Math.cos(w.ang) * w.max * f, w.y + Math.sin(w.ang) * w.max * f, ax, ay, bx, by) < C.botR + 16) return false;
           return true;
         });
}

function setApproach(m, f) {  // точка разгона: на нужной дистанции, в пределах экрана и без преград на пути
  var base = Math.atan2(r.y - f.y, r.x - f.x), best = null;
  for (var i = 0; i < 16 && !best; i++) {
    var ang = base + ((i + 1) >> 1) * (Math.PI / 8) * (i % 2 ? 1 : -1);
    var px = f.x + Math.cos(ang) * C.ramDist, py = f.y + Math.sin(ang) * C.ramDist;
    if (px > 40 && px < desk.W - 40 && py > 70 && py < desk.H - 120 && !desk.blocked(px, py, 6) && clearLine(px, py, f.x, f.y)) best = { x: px, y: py };
  }
  if (!best) best = { x: clamp(f.x + Math.cos(base) * C.ramDist, 40, desk.W - 40), y: clamp(f.y + Math.sin(base) * C.ramDist, 70, desk.H - 120) };
  m.px = best.x; m.py = best.y;
}

function ramStep(f, t, dt) {
  if (!r.ram || r.ram.target !== f) r.ram = { target: f, phase: 'back', px: null, t0: t };
  var m = r.ram, diff;
  if (m.phase === 'back') {
    if (m.px == null) setApproach(m, f);
    var d = Math.hypot(m.px - r.x, m.py - r.y);
    if (d < 14) { r.v = approach(r.v, 0, C.brake, dt); if (Math.abs(r.v) < 20) m.phase = 'aim'; }
    else steer(m.px, m.py, d, dt);
  } else if (m.phase === 'aim') {
    r.v = approach(r.v, 0, C.brake, dt);
    diff = wrap(Math.atan2(f.y - r.y, f.x - r.x) - r.a);
    r.a += clamp(diff, -6 * dt, 6 * dt);
    if (Math.abs(diff) < 0.06) { m.phase = 'charge'; m.t0 = t; sayFrom(P.charge, null, 1300); }
  } else {
    diff = wrap(Math.atan2(f.y - r.y, f.x - r.x) - r.a);
    r.a += clamp(diff, -2.5 * dt, 2.5 * dt);
    r.v = approach(r.v, C.chargeMax, C.accel, dt);
    if (t - m.t0 > 2600) { m.phase = 'back'; m.px = null; }
  }
}

function homeStep(dt) {   // true, когда робот стоит на площадке
  var h = desk.homePos(), dist = Math.hypot(h.x - r.x, h.y - r.y);
  if (dist < 6) { r.v = approach(r.v, 0, 900, dt); return true; }
  steer(h.x, h.y, dist, dt); return false;
}

function autoStep(t, dt) {
  if (!r.needCharge && r.bat < C.battLow) { r.needCharge = true; r.ram = null; sayFrom(P.batLow, null, 2200); }
  if (r.needCharge) {                              // заряд садится: на площадку, пока не зарядится
    homeStep(dt);
    if (r.bat >= C.battResume) { r.needCharge = false; sayFrom(P.batFull, null, 2200); }
    return;
  }
  var tg = (r.ram && !r.ram.target.done) ? r.ram.target : null;
  if (!tg) { r.ram = null; tg = desk.nearest(r.x, r.y); }
  if (!tg) {                                       // всё убрано
    if (r.home) { r.v = 0; return; }
    if (homeStep(dt) && Math.abs(r.v) < 5) { r.home = true; sayFrom(P.done, null, 3500); scheduleIdle(t); }
    return;
  }
  r.home = false;
  if (tg.type === 'folder') ramStep(tg, t, dt);
  else steer(tg.x, tg.y, Math.hypot(tg.x - r.x, tg.y - r.y), dt);
}

/* ---- ручной режим: инерция + дрифт на пробеле ---- */
function manualStep(dt) {
  var K = input.keys, sp = Math.hypot(r.v, r.lat);
  r.drifting = !!(K[' '] || K.Shift) && sp > C.driftMinSpeed;
  var tr = C.manualTurn * (r.drifting ? 1.6 : 1);
  if (K.ArrowLeft) r.a -= tr * dt;
  if (K.ArrowRight) r.a += tr * dt;
  if (K.ArrowUp) r.v = approach(r.v, C.maxManual, C.accel * (r.drifting ? 0.7 : 1), dt);
  else if (K.ArrowDown) r.v = approach(r.v, -C.backMax, C.brake, dt);
  else r.v = approach(r.v, 0, C.friction, dt);
  r.ram = null; r.home = false;
}

/* ---- батарея ---- */
var lastPct = -1, lastChg = null;
function batteryUI(chg) {
  var pct = Math.round(r.bat);
  if (pct === lastPct && chg === lastChg) return;
  lastPct = pct; lastChg = chg;
  D.battfill.style.width = pct + '%'; D.battpct.textContent = pct + '%';
  D.batt.className = (pct < 20 ? 'low' : pct < 40 ? 'mid' : '') + (chg ? ' chg' : '');
}

/* ---- один кадр ---- */
function update(t, dt) {
  T = t;
  var held = input.keys.ArrowLeft || input.keys.ArrowRight || input.keys.ArrowUp || input.keys.ArrowDown;
  if (held) input.lastKeyTime = t;
  var manual = !r.dead && input.lastKeyTime > 0 && t - input.lastKeyTime < C.manualTimeoutMs;
  input.manual = manual;

  if (manual && !r.wasManual) { r.wasManual = true; sayFrom(P.manualOn, null, 1800); }
  if (!manual && r.wasManual) { r.wasManual = false; hideHint(); sayFrom(P.manualOff, null, 1800); }

  var a0 = r.a, v0 = r.v, wasDrift = r.drifting;
  if (r.dead) {
    r.v = approach(r.v, 0, 900, dt); r.lat = approach(r.lat, 0, 900, dt); r.drifting = false;
    if (t > r.deadUntil) { r.dead = false; r.bat = Math.max(r.bat, C.battEmergency); r.needCharge = true; sayFrom(P.batRevive, null, 2500); }
  } else if (t < r.stunUntil) {   // оглушён взрывом: крутится и скользит
    r.a += 9 * r.spinDir * dt; r.v = approach(r.v, 0, 300, dt); r.drifting = false;
  } else if (manual) {
    manualStep(dt);
    showHint(fill(P.hintManual, { s: Math.ceil((C.manualTimeoutMs - (t - input.lastKeyTime)) / 1000) }));
  } else {
    r.drifting = t < r.driftUntil;
    if (r.wait > 0) { r.wait -= dt; r.v = approach(r.v, 0, 600, dt); }
    else autoStep(t, dt);
  }

  // масло: управление и тормоза слабеют, нос уводит в кручение
  var slick = desk.oil.some(function (o) { return Math.hypot(o.x - r.x, o.y - r.y) < o.r; });
  if (slick && !r.wasSlick) {
    r.oilSpin = (Math.random() < 0.5 ? -1 : 1) * rand(1.5, 3);
    if (t - r.lastOil > 3000) { r.lastOil = t; sayFrom(P.oil, null, 1800); }
  }
  r.wasSlick = slick;
  if (slick && !r.dead && t >= r.stunUntil) { r.v = v0 + (r.v - v0) * 0.3; r.a = a0 + (r.a - a0) * 0.5 + r.oilSpin * dt; }

  // поворот носа не поворачивает скорость: часть уходит в боковую — это и есть занос
  var da = r.a - a0;
  if (da) { var c = Math.cos(da), sn = Math.sin(da), v2 = r.v * c + r.lat * sn; r.lat = -r.v * sn + r.lat * c; r.v = v2; }
  r.lat *= Math.exp(-(slick ? C.gripOil : r.drifting ? C.gripDrift : C.grip) * dt);
  if (r.drifting && !wasDrift && t - r.lastDriftSay > 3500) { r.lastDriftSay = t; sayFrom(P.drift, null, 1500); }

  // движение и стены (отскок)
  var fx = Math.cos(r.a), fy = Math.sin(r.a), wx = fx * r.v - fy * r.lat, wy = fy * r.v + fx * r.lat;
  var nx = r.x + wx * dt, ny = r.y + wy * dt, cx = clamp(nx, 20, desk.W - 20), cy = clamp(ny, 40, desk.H - 20);
  if (cx !== nx || cy !== ny) {
    var pre = Math.hypot(wx, wy);
    if (cx !== nx) wx = -wx * 0.3;
    if (cy !== ny) wy = -wy * 0.3;
    r.v = wx * fx + wy * fy; r.lat = -wx * fy + wy * fx;
    if (manual && pre > 120 && t - r.lastWall > 4000) { r.lastWall = t; sayFrom(P.wall, null, 1500); }
  }
  r.x = cx; r.y = cy;
  trail(t);
  desk.updateWalls(t);
  hitHazards(t);

  // касания: файлы подбираются, папки — бьются
  for (var i = 0; i < desk.items.length; i++) {
    var it = desk.items[i];
    if (it.done || t < it.readyAt) continue;
    var d = Math.hypot(it.x - r.x, it.y - r.y);
    if (it.type === 'folder') { if (d < C.folderR) { hitFolder(it, t); break; } }
    else if (d < C.collectR) { collect(it); break; }
  }

  // батарея: на площадке заряжается, в остальное время тратится
  var h = desk.homePos(), spd = Math.hypot(r.v, r.lat);
  var onPad = Math.hypot(h.x - r.x, h.y - r.y) < 38 && spd < 60;
  var charging = onPad && r.bat < 100;
  if (onPad) r.bat = Math.min(100, r.bat + C.chargeRate * dt);
  else if (!r.dead) drain((C.drain.base + spd * C.drain.speed + (r.drifting ? C.drain.drift : 0)) * dt);
  if (r.bat > 35) { r.warn20 = r.warn10 = false; }
  if (manual) {
    if (r.bat < 10 && !r.warn10) { r.warn10 = r.warn20 = true; sayFrom(P.batWarn10, null, 2200); }
    else if (r.bat < 20 && !r.warn20) { r.warn20 = true; sayFrom(P.batWarn20, null, 2200); }
  }
  if (r.bat <= 0 && !r.dead) {
    r.dead = true; r.deadUntil = t + 4000; r.wasManual = false; r.ram = null; hideHint(); sayFrom(P.batDead, null, 3500);
  }
  batteryUI(charging);

  // болтовня без повода (не во время разгона)
  if (t >= r.nextIdle) {
    scheduleIdle(t);
    if (!r.dead && !(r.ram && r.ram.phase === 'charge')) sayFrom(charging ? P.charging : r.home ? P.sleep : P.idle, null, 2000);
  }

  D.bot.style.transform = 'translate(' + r.x + 'px,' + r.y + 'px)';
  D.body.style.transform = 'rotate(' + r.a + 'rad)';
  D.bot.classList.toggle('angry', !!(r.ram && r.ram.phase !== 'back'));
  D.bot.classList.toggle('dead', r.dead);
}

/* =====================================================================
   6. ВВОД
   ===================================================================== */
var ARROW = { ArrowLeft: 1, ArrowRight: 1, ArrowUp: 1, ArrowDown: 1 };
var TRACK = { ArrowLeft: 1, ArrowRight: 1, ArrowUp: 1, ArrowDown: 1, ' ': 1, Shift: 1 };
window.addEventListener('keydown', function (e) {
  if (!TRACK[e.key]) return;
  if (e.key !== 'Shift') e.preventDefault();
  input.keys[e.key] = true;
  if (ARROW[e.key]) input.lastKeyTime = performance.now();
});
window.addEventListener('keyup', function (e) {
  if (!TRACK[e.key]) return;
  if (e.key !== 'Shift') e.preventDefault();
  input.keys[e.key] = false;
  if (ARROW[e.key]) input.lastKeyTime = performance.now();
});
window.addEventListener('blur', function () { input.keys = {}; });

D.desk.addEventListener('pointerdown', function (e) {
  if (e.target.closest('#bar')) return;
  var d = new Date(), x = clamp(e.clientX, 50, desk.W - 50), y = clamp(e.clientY, 70, desk.H - 120);
  desk.addIcon('Screenshot ' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
               ' at ' + pad2(d.getHours()) + '.' + pad2(d.getMinutes()) + '.' + pad2(d.getSeconds()), 'shot', x, y, true);
  hideHint(); r.home = false;
  if (Math.random() < 0.5) sayFrom(P.newShot, null, 1900);
});

D.mess.addEventListener('click', function () {
  desk.reset(); r.home = false; r.ram = null; D.mess.blur(); sayFrom(P.reset, null, 1900);
});

/* =====================================================================
   7. ЗАПУСК
   ===================================================================== */
function tickClock() { var d = new Date(); D.clock.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
desk.measure(); window.addEventListener('resize', function () { desk.measure(); desk.buildTrack(); desk.makeHazards(); });
tickClock(); setInterval(tickClock, 30000);
var h0 = desk.homePos(); r.x = h0.x; r.y = h0.y; scheduleIdle(0);
desk.buildTrack(); desk.makeHazards(); desk.scatter();
showHint(P.hintStart);
setTimeout(function () { sayFrom(P.start, null, 2000); }, 500);
setTimeout(function () { if (!input.manual) hideHint(); }, 9000);

var last = 0;
function loop(t) { var dt = Math.min((t - last) / 1000 || 0, 0.05); last = t; update(t, dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
